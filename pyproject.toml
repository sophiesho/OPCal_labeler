[project]
name = "opcal-mlt"
version = "1.2.0"
description = "OPCAL-Labeler: manual labeling tool for calcium imaging traces"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "OPCAL Team" }]

dependencies = [
  "streamlit>=1.36,<2.0",
  "numpy>=1.26,<2.0",
  "pandas>=2.2,<3.0",
  "scipy>=1.12,<2.0",
  "matplotlib>=3.8,<4.0",
  "plotly>=5.22,<6.0",
  "Pillow>=10,<11",
  "pydantic>=2.5,<3.0"
]

[project.scripts]
opcal-mlt = "opcal_mlt.app.launch:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black>=24.0",
  "ruff>=0.4",
  "watchdog>=4.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["opcal_mlt*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"opcal_mlt.app" = ["main.py", "assets/*.png", "config/*.toml"]
"opcal_mlt.core" = ["data/*.json"]


[tool.versioning]
release-date = "2026-06-24"
changelog = "Updated to version 1.2.0 with standalone distribution, PyInstaller-safe launch, and source launcher preflight checks."

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
pythonpath = [
  "src",
]
testpaths = [
  "tests/unit",
]
xfail_strict = true
filterwarnings = [
  "error::DeprecationWarning",
]
